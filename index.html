<style>
  :root{
    --bg:#F5F6F8; --card:#fff; --line:#E6E8EC; --text:#16181D; --sub:#8B9099;
    --red:#E5322D; --blue:#2F6BFF; --cw:54px;
    --c-food:#CDEBB4; --c-cafe:#BFE8DF; --c-shop:#F9CFDC; --c-move:#CBDCFB; --c-etc:#E3E3E8; --c-zero:#FFE8A3;
    --t-food:#3F6E14; --t-cafe:#1D6B5C; --t-shop:#A1284F; --t-move:#2A55A8; --t-etc:#5C5C63; --t-zero:#7A5B00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif}
  .app{max-width:480px;margin:0 auto;padding:16px 0 120px}
  .brand{padding:0 16px;font-family:'Helvetica Neue','Inter Tight',Helvetica,Arial,sans-serif;font-weight:700;font-size:20px;letter-spacing:-.3px;color:#16181D;display:flex;align-items:center;line-height:1.1}
  .bstar{width:.86em;height:.86em;margin:0 .03em;transform:translateY(-.02em)}
  .top{display:flex;align-items:center;padding:4px 16px 12px;gap:6px;min-height:52px}
  .top h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.5px;flex:1}
  .nav{border:none;background:none;font-size:22px;color:var(--text);padding:4px 8px;cursor:pointer}
  .pill{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);font-family:inherit}
  .pill.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
  .icon{border:none;background:none;font-size:22px;cursor:pointer;padding:4px;display:flex;align-items:center}
  .edit-only{display:none}
  body.editing .edit-only{display:inline-block}
  body.editing .view-only{display:none}
  .summary{margin:0 12px 12px;background:var(--card);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .summary .label{font-size:13px;color:var(--sub)}
  .summary .val{font-size:20px;font-weight:800;margin-top:2px}
  .summary .zero{font-size:13px;font-weight:700;background:#FFF6D6;color:#8A6A00;border-radius:999px;padding:6px 10px}
  /* 달력 */
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:14px;color:#555;padding:6px 0;border-bottom:1px solid var(--line)}
  .week span:first-child{color:var(--red)}
  .board{position:relative}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cell{min-height:calc(var(--cw)*2.45 + 27px);border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .cell:nth-child(7n){border-right:none}
  .cell.out .num{opacity:.35}
  .head{width:100%;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
  .slot{width:100%;height:calc(var(--cw)*.62);margin-top:auto;display:flex;justify-content:center;align-items:flex-end;flex-shrink:0}
  .num{font-size:15px;font-weight:500;line-height:24px;min-width:24px;height:24px;text-align:center;border-radius:12px}
  .cell.sun .num,.cell.hol .num{color:var(--red)}
  .cell.today .num{background:var(--text);color:#fff !important;font-weight:700}
  .hname{font-size:10px;color:var(--red)}
  /* 첫번째 사진과 같은 ⭐ (아이폰 기본 이모지) */
  .starE{display:block;height:24px;line-height:24px;font-size:calc(var(--cw)*.44);text-align:center;overflow:visible;
    font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .chip{width:calc(100% - 2px);border-radius:5px;color:#fff;font-size:10.5px;font-weight:700;padding:3px 4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  .chip.zero{background:var(--c-zero);color:var(--t-zero)}
  .chip,.chip.zero,.cat.on{color:#16181D !important}
  .more{font-size:10px;color:var(--sub);font-weight:600}
  /* 자유 배치 사진 */
  .stickers{position:absolute;inset:0;pointer-events:none;overflow:hidden}

/* ---------- 데이터 ----------
   entries: 날짜별 지출 / photos: 사진마다 '어느 날짜 칸 기준으로 어디에, 얼마나 크게, 몇 도' 있는지 저장 */
const e=(a,m,c,id=null)=>({a,m,c,id});   // id = 서버(Supabase)에 저장된 행 번호
const days={};   // 날짜별 지출 기록 (처음엔 비어 있음)
let uid=1;
const fitW=(ar,box=.62)=>ar>=1?box:box*ar;           // 기본 크기: 칸 너비의 62% 상자 안에 맞춤
const mk=(key,ph,o={})=>({id:uid++,dbid:null,path:null,key,src:ph.src,ar:ph.ar,ox:.5,oy:null,w:fitW(ph.ar),rot:0,...o});
let photos=[];   // 달력에 붙인 사진들 (처음엔 비어 있음)
const won=n=>n.toLocaleString('ko-KR')+'원';
const dayTotal=d=>d.entries.reduce((s,x)=>s+x.a,0);
const isZero=d=>d && d.entries.length>0 && dayTotal(d)===0;
const photosOf=k=>photos.filter(p=>p.key===k);

/* ---------- 달력 ---------- */
function render(){
  const {y,m}=cur;
  $('title').textContent=editing?`${m+1}월 꾸미기`:`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay(), last=new Date(y,m+1,0).getDate();
  const start=new Date(y,m,1-first); const weeks=Math.ceil((first+last)/7);
  const grid=$('grid'); grid.innerHTML='';
  document.documentElement.style.setProperty('--cw',(grid.clientWidth/7)+'px');
  let sum=0,zc=0;
  for(let i=0;i<weeks*7;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const k=keyOf(dt.getFullYear(),dt.getMonth(),dt.getDate()); const d=days[k];
    const inMonth=dt.getMonth()===m;
    const c=document.createElement('div'); c.className='cell'; c.dataset.key=k;
    if(!inMonth) c.classList.add('out');
    if(dt.getDay()===0) c.classList.add('sun');
    if(HOL[k]) c.classList.add('hol');
    if(k===keyOf(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate())) c.classList.add('today');
    if(d&&inMonth){ sum+=dayTotal(d); if(isZero(d)) zc++; }
    const head=isZero(d)?`<span class="starE">⭐</span>`:`<div class="num">${dt.getDate()}</div>${HOL[k]?`<div class="hname">${HOL[k]}</div>`:''}`;
    let chips='';
    if(d){
      if(isZero(d)) chips=`<div class="chip zero">0원</div>`;
      else{
        const list=d.entries.filter(x=>x.a>0);
        list.slice(0,3).forEach(x=>chips+=`<div class="chip" style="background:${CATS[x.c]};color:${FG[x.c]}">${x.a}원${x.m?'-'+x.m:''}</div>`);
        if(list.length>3) chips+=`<div class="more">+${list.length-3}</div>`;
      }
    }
    c.innerHTML=`<div class="head">${head}</div>${chips}<div class="slot"></div>`;
    grid.appendChild(c);
  }
  $('sum').textContent=won(sum);
  $('zeroCnt').textContent=`⭐ 무지출 ${zc}일`;
  renderStickers();
}
const cellEl=k=>$('grid').querySelector(`[data-key="${k}"]`);
// 기본 위치: 사진 밑변이 칸 맨 아래(여백 6px)에 오도록. 옮기기 전까지는 칸 높이가 바뀌어도 계속 맨 밑에 붙어 있음
const defOy=(c,h)=>(c.offsetHeight-6-h/2)/c.offsetWidth;

/* ---------- 사진 그리기 ---------- */
function renderStickers(){
  const layer=$('stickers'); layer.innerHTML='';
  photos.forEach(p=>{
    const c=cellEl(p.key); if(!c) return;
    const cw=c.offsetWidth;
    const el=document.createElement('div'); el.className='stk'+(editing&&p.id===selId?' sel':''); el.dataset.id=p.id;
    el.innerHTML=`<div class="img" style="background-image:url(${p.src})"></div><span class="h del" data-h="del">✕</span><span class="h rs" data-h="rs">⤡</span>`;
    layer.appendChild(el); place(el,p);
  });
}
function geom(p){ const c=cellEl(p.key), cw=c.offsetWidth;
  const w=p.w*cw, h=w/p.ar, oy=p.oy??defOy(c,h); return {cx:c.offsetLeft+p.ox*cw, cy:c.offsetTop+oy*cw, w, h, cw}; }
function place(el,p){ const g=geom(p);
  Object.assign(el.style,{left:(g.cx-g.w/2)+'px',top:(g.cy-g.h/2)+'px',width:g.w+'px',height:g.h+'px',transform:`rotate(${p.rot}deg)`}); }

/* 사진 중심이 들어간 칸으로 기준 날짜를 다시 잡음 */
function reanchor(p,cx,cy){
  let best=null,bd=1e9;
  $('grid').querySelectorAll('.cell').forEach(c=>{
    const x=Math.max(c.offsetLeft,Math.min(cx,c.offsetLeft+c.offsetWidth)), y=Math.max(c.offsetTop,Math.min(cy,c.offsetTop+c.offsetHeight));
    const d=Math.hypot(cx-x,cy-y); if(d<bd){bd=d;best=c;} });
  const cw=best.offsetWidth; const w=p.w*geom(p).cw/cw;
  Object.assign(p,{key:best.dataset.key, ox:(cx-best.offsetLeft)/cw, oy:(cy-best.offsetTop)/cw, w});
}

/* ---------- 보기 모드: 꾹 누르기 = 크게 보기, 탭 = 날짜 열기 ---------- */
let pressTimer=null, longFired=false, startXY=null, pressedEl=null;
function bindLongPress(root, sel, getPhotos){
  root.addEventListener('pointerdown',ev=>{
    if(editing&&root.id==='stickers') return;
    const t=ev.target.closest(sel); if(!t||ev.target.closest('.x')) return;
    longFired=false; startXY=[ev.clientX,ev.clientY]; pressedEl=t; t.classList.add('pressing');
    pressTimer=setTimeout(()=>{ longFired=true; t.classList.remove('pressing');
      try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}
      const {list,idx}=getPhotos(t); openViewer(list,idx); },450);
  });
  const cancel=()=>{clearTimeout(pressTimer); pressedEl&&pressedEl.classList.remove('pressing');};
  root.addEventListener('pointermove',ev=>{ if(startXY&&Math.hypot(ev.clientX-startXY[0],ev.clientY-startXY[1])>10) cancel(); });
  ['pointerup','pointercancel','pointerleave'].forEach(n=>root.addEventListener(n,cancel));
  root.addEventListener('contextmenu',ev=>ev.preventDefault());
}
bindLongPress($('stickers'),'.stk',t=>{ const p=photos.find(x=>x.id==t.dataset.id); const list=photosOf(p.key); return {list:list.map(x=>x.src),idx:list.indexOf(p)}; });
bindLongPress($('sheet'),'.sp',t=>({list:photosOf(openKey).map(x=>x.src),idx:+t.dataset.i}));

const viewer=$('viewer'),vtrack=$('vtrack'),vdots=$('vdots');
function openViewer(list,idx){
  vtrack.innerHTML=list.map(s=>`<div class="vslide"><img src="${s}" alt=""></div>`).join('');
  vdots.innerHTML=list.length>1?list.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join(''):'';
  viewer.classList.add('on'); requestAnimationFrame(()=>vtrack.scrollLeft=idx*vtrack.clientWidth);
}
vtrack.addEventListener('scroll',()=>{const i=Math.round(vtrack.scrollLeft/vtrack.clientWidth);[...vdots.children].forEach((d,j)=>d.classList.toggle('on',i===j));});
viewer.addEventListener('click',()=>viewer.classList.remove('on'));

$('stickers').addEventListener('click',ev=>{
  if(editing) return; if(longFired){longFired=false;return;}
  const t=ev.target.closest('.stk'); if(t) openSheet(photos.find(x=>x.id==t.dataset.id).key);
});
$('grid').addEventListener('click',ev=>{
  if(editing){ selId=null; renderStickers(); return; }
  const c=ev.target.closest('.cell'); if(c) openSheet(c.dataset.key);
});

/* ---------- 꾸미기 모드: 이동 / 크기·회전 / 삭제 + 가이드선 ---------- */
function setEditing(on,sel=null){ editing=on; selId=sel; document.body.classList.toggle('editing',on); render(); }
$('deco').onclick=()=>{ setEditing(true); toast('사진을 끌어서 원하는 곳에 놓아요'); };
$('done').onclick=()=>setEditing(false);

let drag=null;
$('stickers').addEventListener('pointerdown',ev=>{
  if(!editing) return;
  const el=ev.target.closest('.stk'); if(!el) return;
  ev.preventDefault();
  const p=photos.find(x=>x.id==el.dataset.id); const h=ev.target.dataset.h;
  if(h==='del'){ photos=photos.filter(x=>x!==p); selId=null; renderStickers(); remote.delPhoto(p); return; }
  if(selId!==p.id){ selId=p.id; renderStickers(); }
  const node=$('stickers').querySelector(`[data-id="${p.id}"]`);
  node.setPointerCapture(ev.pointerId);
  const g=geom(p); const br=$('board').getBoundingClientRect();
  const px=ev.clientX-br.left, py=ev.clientY-br.top;
  drag={p,node,mode:h==='rs'?'rs':'mv',g0:g,px,py,
    d0:Math.hypot(px-g.cx,py-g.cy), a0:Math.atan2(py-g.cy,px-g.cx), w0:p.w, r0:p.rot, cx:g.cx, cy:g.cy};
});
$('stickers').addEventListener('pointermove',ev=>{
  if(!drag) return;
  const br=$('board').getBoundingClientRect(); const px=ev.clientX-br.left, py=ev.clientY-br.top;
  const {p,g0}=drag;
  if(drag.mode==='mv'){
    let cx=g0.cx+(px-drag.px), cy=g0.cy+(py-drag.py);
    const s=snap(cx,cy); cx=s.x; cy=s.y; drag.cx=cx; drag.cy=cy;
    const w=p.w*g0.cw, h=w/p.ar;
    Object.assign(drag.node.style,{left:(cx-w/2)+'px',top:(cy-h/2)+'px'});
  }else{
    const sc=Math.hypot(px-g0.cx,py-g0.cy)/drag.d0;
    p.w=Math.min(5,Math.max(.25,drag.w0*sc));
    let r=drag.r0+(Math.atan2(py-g0.cy,px-g0.cx)-drag.a0)*180/Math.PI;
    r=((r+540)%360)-180; if(Math.abs(r)<4) r=0;   // 0도 근처면 똑바로 맞춰줌
    p.rot=r; place(drag.node,p);
  }
});
const endDrag=()=>{ if(!drag) return;
  if(drag.mode==='mv') reanchor(drag.p,drag.cx,drag.cy);
  const moved=drag.p; drag=null; hideGuides(); renderStickers(); remote.savePhoto(moved); };
$('stickers').addEventListener('pointerup',endDrag);
$('stickers').addEventListener('pointercancel',endDrag);

/* 칸 가운데 / 날짜 자리 근처로 가면 빨간 가이드선 + 칸 강조 */
function snap(x,y){
  const T=7, cells=[...$('grid').querySelectorAll('.cell')];
  let sx=null, sy=null, cellX=null, cellY=null;
  for(const c of cells.slice(0,7)){ const v=c.offsetLeft+c.offsetWidth/2; if(Math.abs(x-v)<T){sx=v;cellX=c;break;} }
  for(let i=0;i<cells.length;i+=7){ const c=cells[i], cw=c.offsetWidth;
    for(const v of [c.offsetTop+defOy(c,cw*.62)*cw, c.offsetTop+c.offsetHeight/2]) if(Math.abs(y-v)<T){sy=v;cellY=c;} }
  const gv=$('gv'),gh=$('gh'),hl=$('ghl');
  gv.style.display=sx!=null?'block':'none'; if(sx!=null) gv.style.left=sx+'px';
  gh.style.display=sy!=null?'block':'none'; if(sy!=null) gh.style.top=sy+'px';
  if(sx!=null&&sy!=null){ const c=cells[cells.indexOf(cellY)+cells.indexOf(cellX)];
    Object.assign(hl.style,{display:'block',left:c.offsetLeft+'px',top:c.offsetTop+'px',width:c.offsetWidth+'px',height:c.offsetHeight+'px'});
  } else hl.style.display='none';
  return {x:sx??x, y:sy??y};
}
const hideGuides=()=>['gv','gh','ghl'].forEach(i=>$(i).style.display='none');

/* ---------- 사진 추가: 선택 → 자르기 → 달력에 배치 ---------- */
let addTarget=null;
$('addPhotoEdit').onclick=()=>{
  // 화면 가운데에 보이는 칸에 놓기
  const cells=[...$('grid').querySelectorAll('.cell:not(.out)')]; const mid=innerHeight/2;
  let best=cells[0],bd=1e9; cells.forEach(c=>{const r=c.getBoundingClientRect();const d=Math.abs((r.top+r.bottom)/2-mid)+Math.abs((r.left+r.right)/2-innerWidth/2);if(d<bd){bd=d;best=c;}});
  addTarget=best.dataset.key; $('file').click();
};
$('file').addEventListener('change',ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  const url=URL.createObjectURL(f); openCrop(url);
});
let crop=null;
function openCrop(url){
  const img=$('cimg'); img.onload=()=>{
    const W=img.clientWidth,H=img.clientHeight; crop={x:0,y:0,w:W,h:H,W,H}; drawCrop(); };
  img.src=url; $('crop').classList.add('on');
}
function drawCrop(){ Object.assign($('crect').style,{left:crop.x+'px',top:crop.y+'px',width:crop.w+'px',height:crop.h+'px'}); }
let cd=null;
$('cbox').addEventListener('pointerdown',ev=>{
  if(!crop) return; ev.preventDefault(); $('cbox').setPointerCapture(ev.pointerId);
  cd={c:ev.target.dataset.c||(ev.target.id==='crect'?'mv':null),x:ev.clientX,y:ev.clientY,r:{...crop}};
});
$('cbox').addEventListener('pointermove',ev=>{
  if(!cd||!cd.c) return; const dx=ev.clientX-cd.x, dy=ev.clientY-cd.y, r=cd.r, M=40;
  let {x,y,w,h}=r;
  if(cd.c==='mv'){ x=Math.min(Math.max(0,r.x+dx),crop.W-w); y=Math.min(Math.max(0,r.y+dy),crop.H-h); }
  else{
    if(cd.c.includes('l')){ const nx=Math.min(Math.max(0,r.x+dx),r.x+r.w-M); w=r.w+(r.x-nx); x=nx; }
    if(cd.c.includes('r')){ w=Math.min(Math.max(M,r.w+dx),crop.W-r.x); }
    if(cd.c.includes('t')){ const ny=Math.min(Math.max(0,r.y+dy),r.y+r.h-M); h=r.h+(r.y-ny); y=ny; }
    if(cd.c.includes('b')){ h=Math.min(Math.max(M,r.h+dy),crop.H-r.y); }
  }
  Object.assign(crop,{x,y,w,h}); drawCrop();
});
$('cbox').addEventListener('pointerup',()=>cd=null);
const closeCrop=()=>{ $('crop').classList.remove('on'); URL.revokeObjectURL($('cimg').src); crop=null; };
$('cCancel').onclick=closeCrop;
$('cOk').onclick=()=>{
  const img=$('cimg'), k=img.naturalWidth/crop.W;
  const sw=crop.w*k, sh=crop.h*k, r=Math.min(1,1400/Math.max(sw,sh));
  const cv=document.createElement('canvas'); cv.width=Math.round(sw*r); cv.height=Math.round(sh*r);
  cv.getContext('2d').drawImage(img,crop.x*k,crop.y*k,sw,sh,0,0,cv.width,cv.height);
  const ph={src:cv.toDataURL('image/jpeg',.85),ar:sw/sh}; closeCrop();
  const p=mk(addTarget,ph); photos.push(p); remote.addPhoto(p);
  closeSheet(); setEditing(true,p.id); toast('끌어서 옮기고, ⤡로 크기·회전, 완료!');
};

/* ---------- 날짜 상세 시트 ---------- */
const sheet=$('sheet'), dim=$('dim');
function openSheet(k){ openKey=k; drawSheet(); sheet.classList.add('on'); dim.classList.add('on'); }
function closeSheet(){ sheet.classList.remove('on'); dim.classList.remove('on'); openKey=null; }
dim.addEventListener('click',closeSheet);
function drawSheet(){
  const k=openKey; const d=days[k]||{entries:[]}; const ps=photosOf(k); const [y,m,dd]=k.split('-').map(Number);
  const wd='일월화수목금토'[new Date(y,m-1,dd).getDay()];
  const tot=d.entries.length?(isZero(d)?'⭐ 무지출 데이':won(dayTotal(d))):'아직 기록이 없어요';
  const body=$('sheetBody');
  body.innerHTML=`
    <h2>${m}월 ${dd}일 (${wd})</h2><div class="total">${tot}</div>
    <div class="sec">사진 · 꾹 누르면 크게 보여요</div>
    <div class="strip">${ps.map((p,i)=>`<div class="sp" data-i="${i}" style="background-image:url(${p.src})"><span class="x" data-delp="${p.id}">✕</span></div>`).join('')}
      <div class="addp" id="addp"><b>＋</b>사진</div></div>
    <div class="sec">내역</div>
    ${d.entries.length?d.entries.map((x,i)=>`<div class="row"><span class="dot" style="background:${x.a===0?'var(--c-zero)':CATS[x.c]};border:1.5px solid ${x.a===0?'var(--t-zero)':FG[x.c]}"></span>
      <span class="m">${x.a===0?'무지출':(x.m||x.c)}</span><span class="a">${won(x.a)}</span><button class="del" data-dele="${i}">✕</button></div>`).join('')
      :'<div class="empty">지출을 추가하거나, 안 썼으면 ‘무지출’을 눌러요</div>'}
    <div class="form"><input class="amt" id="amt" inputmode="numeric" placeholder="금액"><input id="memo" placeholder="메모 (예: 국밥)"></div>
    <div class="cats">${Object.keys(CATS).map(c=>`<button class="cat ${c===selCat?'on':''}" data-cat="${c}" style="${c===selCat?'background:'+CATS[c]+';color:'+FG[c]:''}">${c}</button>`).join('')}</div>
    <div class="btns"><button class="btn zero" id="zbtn">⭐ 무지출</button><button class="btn main" id="add">추가</button></div>
    <div class="tip">0원만 기록된 날은 날짜 자리에 자동으로 ⭐이 떠요.</div>`;
  const amt=body.querySelector('#amt');
  amt.addEventListener('input',()=>{const v=amt.value.replace(/[^0-9]/g,'');amt.value=v?(+v).toLocaleString('ko-KR'):'';});
  body.querySelector('#addp').onclick=()=>{ addTarget=k; $('file').click(); };
  body.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selCat=b.dataset.cat;drawSheet();});
  body.querySelectorAll('[data-delp]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const p=photos.find(x=>x.id==b.dataset.delp);photos=photos.filter(x=>x!==p);drawSheet();render();remote.delPhoto(p);});
  body.querySelectorAll('[data-dele]').forEach(b=>b.onclick=()=>{const [x]=ensure(k).entries.splice(+b.dataset.dele,1);clean(k);drawSheet();render();remote.delEntry(x);});
  body.querySelector('#add').onclick=()=>{
    if(!amt.value){amt.focus();return;}
    const x=e(+amt.value.replace(/[^0-9]/g,''),body.querySelector('#memo').value.trim(),selCat);
    ensure(k).entries.push(x); closeSheet(); render(); remote.addEntry(k,x);   // 추가하면 창이 내려감
  };
  body.querySelector('#zbtn').onclick=async()=>{ const x=ensure(k); x.entries=x.entries.filter(v=>v.a!==0); const z=e(0,'','기타'); x.entries.push(z); closeSheet(); render();
    await remote.delZero(k); remote.addEntry(k,z); };
}

/* ---------- 설정: 카테고리 관리 · 배경화면 ---------- */
function openSettings(){ openKey=null; drawSettings('main'); sheet.classList.add('on'); dim.classList.add('on'); }
let palFor=null;
function catStats(c){ let n=0,a=0; Object.values(days).forEach(d=>d.entries.forEach(x=>{if(x.c===c){n++;a+=x.a;}})); return {n,a}; }
function drawSettings(view){
  const body=$('sheetBody');
  if(view==='main'){
    body.innerHTML=`<h2>설정</h2><div class="total">페이로그</div>
      ${me?`<div class="acct"><span>👤</span><span class="em">${me.email}</span><button id="logout">로그아웃</button></div>`:''}
      <button class="menu" id="mCat"><span class="ic" style="background:#CDEBB4">🏷️</span><span class="sp2">카테고리 관리</span><span class="arr">›</span></button>
      <button class="menu" id="mBg"><span class="ic" style="background:#CBDCFB">🖼️</span><span class="sp2">배경화면</span><span class="arr">›</span></button>`;
    $('mCat').onclick=()=>drawSettings('cat'); $('mBg').onclick=()=>drawSettings('bg');
    const lo=$('logout'); if(lo) lo.onclick=async()=>{ await sb.auth.signOut(); closeSheet(); };
    return;
  }
  if(view==='cat'){
    body.innerHTML=`<button class="back" id="back">‹ 설정</button><h2>카테고리 관리</h2><div class="total">색을 누르면 바꿀 수 있어요</div>
      ${Object.keys(CATS).map(c=>{const st=catStats(c);return `<div class="catrow"><button class="sw" data-sw="${c}" style="background:${CATS[c]}" aria-label="${c} 색 바꾸기"></button>
        <input value="${c}" data-name="${c}" maxlength="8" aria-label="카테고리 이름"><span class="cnt">${st.n}건</span><button class="rm" data-rm="${c}" aria-label="${c} 삭제">✕</button></div>
        ${palFor===c?`<div class="pal">${PALETTE.map(p=>`<button data-pc="${p}" class="${p===CATS[c]?'on':''}" style="background:${p}"></button>`).join('')}</div>`:''}`}).join('')}
      <div class="form"><input id="newCat" placeholder="새 카테고리 (예: 데이트)" maxlength="8"></div>
      <div class="btns"><button class="btn main" id="addCat">추가</button></div>`;
    $('back').onclick=()=>{palFor=null;drawSettings('main');};
    body.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{palFor=palFor===b.dataset.sw?null:b.dataset.sw;drawSettings('cat');});
    body.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{CATS[palFor]=b.dataset.pc;palFor=null;drawSettings('cat');render();remote.saveSettings();});
    body.querySelectorAll('[data-name]').forEach(inp=>inp.onchange=()=>renameCat(inp.dataset.name,inp.value.trim()));
    body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>askDelete(b.dataset.rm));
    $('addCat').onclick=()=>{ const n=$('newCat').value.trim(); if(!n) return $('newCat').focus();
      if(CATS[n]) return toast('이미 있는 이름이에요');
      const used=Object.values(CATS); CATS[n]=PALETTE.find(p=>!used.includes(p))||PALETTE[0]; drawSettings('cat'); remote.saveSettings(); };
    return;
  }
  if(view==='bg'){
    body.innerHTML=`<button class="back" id="back">‹ 설정</button><h2>배경화면</h2><div class="total">달력 뒤에 깔리는 배경이에요</div>
      <div class="bgs">${BGS.map((b,i)=>`<button data-bg="${i}" class="${bgState.i===i?'on':''}" style="background:${b.css}">${b.name}</button>`).join('')}
      <button id="bgPhoto" class="${bgState.i===-1?'on':''}" style="${bgState.photo?`background-image:url(${bgState.photo})`:'background:#fff'}">${bgState.photo?'내 사진':'＋ 내 사진'}</button></div>`;
    $('back').onclick=()=>drawSettings('main');
    body.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bgState.i=+b.dataset.bg;applyBg();drawSettings('bg');remote.saveSettings();});
    $('bgPhoto').onclick=()=>$('bgfile').click();
  }
}
function renameCat(from,to){
  if(!to||to===from) return drawSettings('cat');
  if(CATS[to]){ toast('이미 있는 이름이에요'); return drawSettings('cat'); }
  const next={}; Object.keys(CATS).forEach(k=>next[k===from?to:k]=CATS[k]);
  Object.keys(CATS).forEach(k=>delete CATS[k]); Object.assign(CATS,next);
  Object.values(days).forEach(d=>d.entries.forEach(x=>{if(x.c===from)x.c=to;}));
  if(selCat===from) selCat=to; render(); drawSettings('cat');
  remote.renameCat(from,to);
}
function askDelete(c){
  if(Object.keys(CATS).length<=1) return toast('카테고리는 하나 이상 있어야 해요');
  const st=catStats(c);
  const ch=c.charCodeAt(c.length-1), jo=(ch>=0xAC00&&ch<=0xD7A3&&(ch-0xAC00)%28)?'을':'를';  // 받침 있으면 '을'
  $('mtext').innerHTML=st.n?`<b>${c}</b>${jo} 지우면 기록 ${st.n}개(${won(st.a)})도 함께 지워져요. 정말 지울까요?`:`<b>${c}</b> 카테고리를 지울까요?`;
  $('modal').classList.add('on');
  $('myes').onclick=()=>{
    Object.keys(days).forEach(k=>{ days[k].entries=days[k].entries.filter(x=>x.c!==c); clean(k); });
    delete CATS[c]; if(selCat===c) selCat=Object.keys(CATS)[0];
    $('modal').classList.remove('on'); render(); drawSettings('cat'); toast(`${c} 삭제됨`);
    remote.deleteCat(c);
  };
}
$('mno').onclick=()=>$('modal').classList.remove('on');

const BGS=[
  {name:'기본',css:'#F5F6F8'},
  {name:'연두',css:'linear-gradient(180deg,#EAFBC8,#B9EFB0)'},
  {name:'하늘',css:'linear-gradient(180deg,#E3F0FF,#C3DCFF)'},
  {name:'복숭아',css:'linear-gradient(180deg,#FFF0E6,#FFD3C4)'},
  {name:'라벤더',css:'linear-gradient(180deg,#F3EEFF,#DCD0FA)'},
  {name:'크림',css:'#FFF9EC'},
  {name:'민트',css:'linear-gradient(180deg,#E8FBF5,#BFEDE0)'},
  {name:'핑크',css:'linear-gradient(180deg,#FFF0F5,#F9CFDC)'},
];
const bgState={i:0,photo:null,path:null};   // path = 서버에 올린 배경 사진 위치
function applyBg(){
  const b=document.body;
  if(bgState.i===-1&&bgState.photo){ b.style.background=`linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.55)),url(${bgState.photo}) center/cover fixed`; }
  else b.style.background=BGS[bgState.i].css;
  b.style.backgroundAttachment='fixed'; b.style.minHeight='100vh';
}
$('bgfile').addEventListener('change',async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  const url=URL.createObjectURL(f); const img=new Image();
  img.onload=()=>{ const r=Math.min(1,1600/Math.max(img.width,img.height)); const cv=document.createElement('canvas');
    cv.width=img.width*r; cv.height=img.height*r; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    bgState.photo=cv.toDataURL('image/jpeg',.85); bgState.i=-1; URL.revokeObjectURL(url); applyBg(); drawSettings('bg'); remote.saveBgPhoto(bgState.photo); };
  img.src=url;
});
$('gear').onclick=openSettings;

/* ---------- 지출 정리: 이번 달 / 올해, 카테고리별 ---------- */
let stats={tab:'month',cat:null};
function collect(prefix){
  const list=[];
  Object.keys(days).sort().forEach(k=>{ if(!k.startsWith(prefix)) return;
    days[k].entries.forEach(x=>{ if(x.a>0) list.push({...x,key:k}); }); });
  return list;
}
function openStats(){ openKey=null; stats={tab:'month',cat:null}; drawStats(); sheet.classList.add('on'); dim.classList.add('on'); }
function drawStats(){
  const {y,m}=cur; const prefix=stats.tab==='month'?`${y}-${pad(m+1)}-`:`${y}-`;
  const list=collect(prefix); const total=list.reduce((s,x)=>s+x.a,0);
  const by={}; list.forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  const cats=Object.keys(by).sort((a,b)=>by[b]-by[a]);
  const body=$('sheetBody');
  const seg=`<div class="seg"><button data-tab="month" class="${stats.tab==='month'?'on':''}">${m+1}월</button><button data-tab="year" class="${stats.tab==='year'?'on':''}">${y}년 전체</button></div>`;
  if(stats.cat){
    const c=stats.cat, rows=list.filter(x=>x.c===c);
    body.innerHTML=`<button class="back" id="back">‹ 전체 보기</button>${seg}
      <div class="label" style="font-size:13px;color:var(--sub)">${stats.tab==='month'?`${m+1}월`:`${y}년`} ${c}</div>
      <div class="big">${won(by[c]||0)}</div>
      ${rows.length?rows.map(x=>{const [,mm,dd]=x.key.split('-').map(Number);const wd='일월화수목금토'[new Date(y,mm-1,dd).getDay()];
        return `<div class="erow"><span class="d">${mm}/${dd} (${wd})</span><span class="m">${x.m||c}</span><span class="a">${won(x.a)}</span></div>`}).join('')
        :'<div class="empty">이 기간에는 기록이 없어요</div>'}`;
  }else{
    let months='';
    if(stats.tab==='year'){
      const mt=[...Array(12)].map((_,i)=>collect(`${y}-${pad(i+1)}-`));
      const mx=Math.max(1,...mt.map(l=>l.reduce((s,x)=>s+x.a,0)));
      months=`<div class="sec">월별</div>`+mt.map((l,i)=>{const t=l.reduce((s,x)=>s+x.a,0);
        const segs=cats.map(c=>{const v=l.filter(x=>x.c===c).reduce((s,x)=>s+x.a,0);return v?`<i style="width:${v/mx*100}%;background:${CATS[c]}"></i>`:''}).join('');
        return `<div class="mrow ${i===m?'now':''}"><span class="mn">${i+1}월</span><span class="bar">${segs}</span><span class="am">${t?won(t):'-'}</span></div>`}).join('');
    }
    body.innerHTML=`<h2>${stats.tab==='month'?`${m+1}월 지출`:`${y}년 지출`}</h2>${seg}
      <div class="big">${won(total)}</div>
      <div class="stack">${cats.map(c=>`<i style="width:${by[c]/total*100}%;background:${CATS[c]}"></i>`).join('')}</div>
      <div class="sec">카테고리별</div>
      ${cats.length?cats.map(c=>`<button class="crow" data-cat="${c}"><span class="nm">${c}</span>
        <span class="bar"><i style="width:${by[c]/by[cats[0]]*100}%;background:${CATS[c]}"></i></span>
        <span class="am">${won(by[c])}</span><span class="pc">${Math.round(by[c]/total*100)}%</span><span class="arr">›</span></button>`).join('')
        :'<div class="empty">이 기간에는 기록이 없어요</div>'}
      ${months}`;
  }
  body.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stats.tab=b.dataset.tab;drawStats();});
  body.querySelectorAll('.crow').forEach(b=>b.onclick=()=>{stats.cat=b.dataset.cat;drawStats();});
  const bk=body.querySelector('#back'); if(bk) bk.onclick=()=>{stats.cat=null;drawStats();};
}
$('summary').addEventListener('click',()=>{ if(!editing) openStats(); });

const ensure=k=>days[k]||(days[k]={entries:[]});
const clean=k=>{ if(days[k]&&!days[k].entries.length) delete days[k]; };

let tt; function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2200); }

$('prev').onclick=()=>{cur.m--; if(cur.m<0){cur.m=11;cur.y--;} render();};
$('next').onclick=()=>{cur.m++; if(cur.m>11){cur.m=0;cur.y++;} render();};
$('today').onclick=()=>{cur={y:TODAY.getFullYear(),m:TODAY.getMonth()}; render();};
addEventListener('resize',render);
/* ---------- 서버 저장 (Supabase) ----------
   - 왜: 새로고침하거나 폰을 바꿔도 기록이 남게
   - 어디: 지출 → entries 표, 사진 정보 → photos 표 + 사진 파일 → photos 저장소, 카테고리·배경 → settings 표
   - 안전: 모든 표에 "내 user_id인 행만" 보고 쓸 수 있는 규칙(RLS)이 걸려 있음 (schema.sql)
   - 문제 생기는 경우: 인터넷이 끊기면 저장 실패 알림이 뜸 → 그 기록은 새로고침하면 사라짐 */
const remote={
  on(){ return !!(sb&&me); },
  async run(q,what='저장'){ if(!this.on()) return null;
    const {data,error}=await q; if(error){ console.error(error); toast(`${what} 실패: ${error.message}`); return null; } return data; },
  async loadAll(){
    if(!this.on()) return;
    const [st,en,ph]=await Promise.all([
      this.run(sb.from('settings').select('*').maybeSingle(),'불러오기'),
      this.run(sb.from('entries').select('*').order('day').order('created_at'),'불러오기'),
      this.run(sb.from('photos').select('*').order('created_at'),'불러오기')]);
    if(st&&Array.isArray(st.categories)&&st.categories.length){
      Object.keys(CATS).forEach(k=>delete CATS[k]); st.categories.forEach(c=>CATS[c.name]=c.color);
      if(!CATS[selCat]) selCat=Object.keys(CATS)[0];
    }
    if(st&&st.bg){ bgState.i=st.bg.i??0; bgState.path=st.bg.path||null;
      if(bgState.path){ const u=await this.run(sb.storage.from('photos').createSignedUrl(bgState.path,60*60*24*7),'배경 불러오기'); bgState.photo=u?u.signedUrl:null; if(!bgState.photo&&bgState.i===-1) bgState.i=0; }
      applyBg(); }
    Object.keys(days).forEach(k=>delete days[k]);
    (en||[]).forEach(r=>ensure(r.day).entries.push(e(r.amount,r.memo||'',r.category,r.id)));
    photos=[];
    if(ph&&ph.length){
      const urls=await this.run(sb.storage.from('photos').createSignedUrls(ph.map(r=>r.path),60*60*24*7),'사진 불러오기')||[];
      ph.forEach((r,i)=>{ const u=urls[i]&&urls[i].signedUrl; if(!u) return;
        photos.push({id:uid++,dbid:r.id,path:r.path,key:r.day,src:u,ar:r.ar,ox:r.ox,oy:r.oy,w:r.w,rot:r.rot||0}); });
    }
    render();
  },
  async addEntry(day,x){ if(!this.on()) return; const d=await this.run(sb.from('entries').insert({day,amount:x.a,memo:x.m,category:x.c}).select('id').single());
    if(d) x.id=d.id; },
  async delEntry(x){ if(!this.on()) return; if(x&&x.id) await this.run(sb.from('entries').delete().eq('id',x.id),'삭제'); },
  async delZero(day){ if(!this.on()) return; await this.run(sb.from('entries').delete().eq('day',day).eq('amount',0),'삭제'); },
  async renameCat(from,to){ if(!this.on()) return; await this.run(sb.from('entries').update({category:to}).eq('category',from)); await this.saveSettings(); },
  async deleteCat(c){ if(!this.on()) return; await this.run(sb.from('entries').delete().eq('category',c),'삭제'); await this.saveSettings(); },
  async saveSettings(){ if(!this.on()) return;
    await this.run(sb.from('settings').upsert({user_id:me.id,categories:Object.entries(CATS).map(([name,color])=>({name,color})),
      bg:{i:bgState.i,path:bgState.path||null},updated_at:new Date().toISOString()})); },
  async upload(dataUrl,prefix=''){
    const blob=await (await fetch(dataUrl)).blob(); const path=`${me.id}/${prefix}${crypto.randomUUID()}.jpg`;
    const ok=await this.run(sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'}),'사진 올리기');
    return ok?path:null; },
  async addPhoto(p){ if(!this.on()) return;
    const path=await this.upload(p.src); if(!path) return; p.path=path;
    const d=await this.run(sb.from('photos').insert({day:p.key,path,ar:p.ar,ox:p.ox,oy:p.oy,w:p.w,rot:p.rot}).select('id').single());
    if(d){ p.dbid=d.id; if(!photos.includes(p)) return this.delPhoto(p); this.savePhoto(p); } },
  async savePhoto(p){ if(!this.on()) return; if(p&&p.dbid) await this.run(sb.from('photos').update({day:p.key,ox:p.ox,oy:p.oy,w:p.w,rot:p.rot}).eq('id',p.dbid)); },
  async delPhoto(p){ if(!p||!this.on()) return;
    if(p.dbid) await this.run(sb.from('photos').delete().eq('id',p.dbid),'삭제');
    if(p.path) await this.run(sb.storage.from('photos').remove([p.path]),'삭제'); },
  async saveBgPhoto(dataUrl){ if(!this.on()) return;
    const old=bgState.path; const path=await this.upload(dataUrl,'bg-'); if(!path) return;
    bgState.path=path; await this.saveSettings(); if(old) this.run(sb.storage.from('photos').remove([old]),'삭제'); },
};

/* ---------- 로그인 (Supabase + 구글) ----------
   - 왜: 내 가계부를 나만 보고, 나중에 어느 기기에서든 같은 데이터를 보려고
   - 저장 위치: 로그인 정보(세션)는 이 폰 브라우저에 저장, 계정 자체는 Supabase에 저장
   - 주의: 아래 두 값은 공개돼도 되는 값. 비밀 키(secret, service_role, 구글 보안 비밀번호)는 절대 여기에 넣지 않음 */
const SUPABASE_URL='https://qigncjqusoetfyuzsdlr.supabase.co';
const SUPABASE_KEY='sb_publishable_oYUEPhiN2Ce1C5CJjrlSxQ_4TkZAQun';
const NEED_LOGIN=/vercel\.app$/.test(location.hostname);   // Claude 목업 미리보기에서는 로그인 없이 보기
let sb=null, me=null;
function showLogin(on){ $('login').classList.toggle('on',on); }
$('gLogin').onclick=async()=>{
  if(!sb){ $('lErr').textContent='로그인 모듈을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'; return; }
  $('lErr').textContent='';

};
(async function initAuth(){
  if(!NEED_LOGIN) return;
  showLogin(true);
  if(!window.supabase){ $('lErr').textContent='로그인 모듈을 불러오지 못했어요. 새로고침해 주세요.'; return; }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session}}=await sb.auth.getSession();
  me=session?session.user:null; showLogin(!me); if(me) remote.loadAll();
  sb.auth.onAuthStateChange((_e,s)=>{ const was=me&&me.id; me=s?s.user:null; showLogin(!me); if(me&&me.id!==was) remote.loadAll(); });
})();

render();
</script>
